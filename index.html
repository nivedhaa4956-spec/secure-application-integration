<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Internship portal for browsing and applying to internship opportunities.">

    <title>Internship Board</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="container">
            <h1>Internship Board</h1>
            <p>Find internship opportunities and start your career journey.</p>
        </div>
    </header>

    <main class="container">

        <section class="internships" aria-labelledby="internship-heading">
            <h2 id="internship-heading">Available Internships</h2>

            <p id="loading" role="status">
                Loading internships...
            </p>

            <p id="error" class="error" role="alert" hidden>
                Failed to load internships. Please try again.
            </p>

            <div id="internshipList" class="internship-list"></div>
        </section>

        <section class="application" aria-labelledby="application-heading">
            <h2 id="application-heading">Apply for an Internship</h2>

            <form id="applicationForm">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                        autocomplete="name"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="internship">Internship</label>
                    <input
                        type="text"
                        id="internship"
                        name="internship"
                        required
                    >
                </div>

                <button type="submit">
                    Apply Now
                </button>

            </form>

            <p id="formMessage" role="status" aria-live="polite"></p>
        </section>

    </main>

    <footer class="footer">
        <p>Internship Board &copy; 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
